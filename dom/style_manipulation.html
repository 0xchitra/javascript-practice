<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Manipulation</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding: 12px;
    }
    button {
      margin: 12px;
      padding: 24px;
      font-weight: 600;
      background: rgb(118, 255, 177);
      border-radius: 12px;
      border: 4px solid rgb(167, 168, 167);
    }

    .dark {
      background-color: #222;
      color: white;
    }

    li {
      padding: 6px;
      margin: 6px;
      border: 2px solid;
      display: flex;
      border-radius: 8px;
      justify-content: center;
      background: #ff4b4b;
    }

    .hidden {
      display: none;
    }

    .content {
      display: block;
    }

    .content.hidden {
      display: none;
    }
    
  </style>
  <body>
    <h1>Hello, This is style</h1>
    <button id="Btn">click here</button>
    <button id="darkBtn">Dark / Light mode</button>

    <button id="menuBtn">Menu</button>
    <ul id="menu">
      <li>Home</li>
      <li>About</li>
      <li>Contact</li>
    </ul>

    <div class="accordion">
      <h3 class="heading">What is JavaScript?</h3>

      <p class="content">
        JavaScript is a programming language used to make web pages interactive.
      </p>
    </div>

    <div class="accordion">
      <h3 class="heading">What is the DOM?</h3>
      <p class="content">DOM stands for Document Object Model.</p>
    </div>
    <script src="style_manipulation.js"></script>
  </body>
</html>
